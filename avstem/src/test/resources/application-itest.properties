spring.main.banner-mode=off
skanmotovrig.avstem.schedule=*+*+*+*+*+*
skanmotovrig.ovrig.schedule=*+*+*+*+*+*
skanmotovrig.ovrig.endpointuri=sftp://${skanmotovrig.sftp.host}:${skanmotovrig.sftp.port}
skanmotovrig.ovrig.endpointconfig=username={{skanmotovrig.sftp.username}}\
  &password=&preferredAuthentications=publickey\
  &privateKeyFile={{skanmotovrig.sftp.privateKey}}\
  &strictHostKeyChecking=yes&knownHostsFile={{skanmotovrig.sftp.hostKey}}\
  &binary=true
skanmotovrig.ovrig.filomraade.inngaaendemappe=inngaaende
skanmotovrig.ovrig.filomraade.feilmappe=feilmappe
skanmotovrig.ovrig.filomraade.avstemmappe=avstemmappe
skanmotovrig.ovrig.completiontimeout=10s
skanmotovrig.avstem.startup=true

# jira
jira.username=srvjira
jira.password=jirapassord
skanmotovrig.jira.url=${wiremock.server.baseUrl}

# reactive
spring.http.codecs.max-in-memory-size=50MB

# sftp
skanmotovrig.sftp.host=localhost
skanmotovrig.sftp.username=itestUser
skanmotovrig.sftp.privateKey=src/test/resources/sftp/klient_id_rsa
skanmotovrig.sftp.hostKey=src/test/resources/sftp/known_hosts

# pgp
skanmotovrig.pgp.passphrase=dummy
skanmotovrig.pgp.privateKey=src/test/resources/pgp/privateKeyRSA.gpg

#Azure
azure.openid-config-token-endpoint=${wiremock.server.baseUrl}/azure_token
azure.app-client-id=test-client
azure.app-client-secret=test-secret

#JournalpostAPI
skanmotovrig.endpoints.dokarkiv.url=${wiremock.server.baseUrl}/rest/journalpostapi/v1
skanmotovrig.endpoints.dokarkiv.scope=api://dev-fss.teamdokumenthandtering.dokarkiv/.default

# Slack
slack.token=xoxb-123
slack.channel=test-channel
slack.alerts-enabled=false
skanmotovrig.slack-varsel-cron=0/15 * * * * *
skanmotovrig.slack.url=${wiremock.server.baseUrl}/slack/api/

spring.main.allow-bean-definition-overriding=true